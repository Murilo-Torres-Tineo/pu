<!DOCTYPE html>
<html lang="pt-BR">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="Calc.css">
    <script src="./js/Calc_2.js" defer></script>
</head>
 
<body>
    <h1>Calculadora</h1>
 
    <form action="#" class="box">
        <input type="text" id="num1" placeholder="Primeiro número">
        <input type="text" id="num2" placeholder="Segundo número">
 
        <div class="btn-area">
        <button type="button" id="btnSomar">Somar</button>
        <button type="button" id="btnSubtrair">Subtrair</button>
        <button type="button" id="btnLimpar">Limpar</button>
        <button type="button" id="btnMultiplicar">Multiplicar</button>
        <button type="button" id="btnDividir">Dividir</button>
    </div>
    </form>
 
    <div class="box invisible" id="caixaResultado">
        <p>Resultado:</p>
        <p id="resultado"></p>
    </div>
</body>
 
</html>
